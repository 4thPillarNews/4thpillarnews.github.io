<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4th Pillar News</title>
<style>
body{margin:0;font-family:Arial, sans-serif;background:#fff}
.top{background:#b30000;padding:12px 15px}
.top a{color:#fff;text-decoration:none;font-weight:bold;font-size:16px}
.box{max-width:720px;margin:auto;padding:16px}
.box h1{font-size:24px;line-height:1.3;margin:10px 0}
.box img{width:100%;border-radius:10px;margin:12px 0}
.byline{color:#b30000;font-weight:bold;font-size:15px;margin:6px 0}
.meta{color:#666;font-size:13px;margin-bottom:10px}
.box p{font-size:17px;line-height:1.7;margin:12px 0;color:#222}
</style>
</head>
<body>
<div class="top"><a href="index.html">← 4th Pillar News</a></div>
<div class="box" id="newsBox">Loading news...</div>

<script>
let id = parseInt(new URLSearchParams(location.search).get('id') || 0);
fetch('news.json?v=' + Date.now())
.then(r => r.json())
.then(list => {
  let n = list.find(x => x.id == id) || list[0];

  // SAFI KARA - agar para me dusri khabar ghusi hai to kaat dega
  function clean(t){
    if(!t) return "";
    return t.split("4th Pillar")[0].split("अगली खबर")[0].split("NEXT NEWS")[0].substring(0,1000).trim();
  }

  document.getElementById('newsBox').innerHTML = `
    <h1>${n.title}</h1>
    <div class="byline">By Gaurav Sharma | 4th Pillar News</div>
    <div class="meta">${n.date} | ${n.category}</div>
    <img src="${n.image}">
    <p>${clean(n.para1)}</p>
    <p>${clean(n.para2)}</p>
    ${n.para3? `<p>${clean(n.para3)}</p>` : ""}
    ${n.para4? `<p>${clean(n.para4)}</p>` : ""}
  `;
});
</script>
</body>
</html>
