<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Detail</title>
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5}
.header{background:#0a1e3c;color:white;padding:12px;text-align:center}
.header a{color:white;text-decoration:none}
.container{max-width:700px;margin:0 auto;background:white;padding:15px}
h1{font-size:22px;line-height:1.4}
.meta{color:#b91c1c;font-size:14px;margin:10px 0;border-bottom:1px solid #eee;padding-bottom:10px}
.meta span{color:#333}
img{width:100%;border-radius:8px;max-height:400px;object-fit:cover}
.content{font-size:17px;line-height:1.8;margin-top:15px;color:#222}
</style>
</head>
<body>
<div class="header"><a href="index.html">← Back The 4th Pillar News</a></div>
<div class="container" id="detail">Loading...</div>
<script>
async function loadDetail(){
  let params=new URLSearchParams(window.location.search);
  let id=params.get('id');
  let r=await fetch('news.json?v='+Date.now());
  let data=await r.json();
  let allNews=Array.isArray(data)?data:Object.values(data).flat();
  let n=allNews.find(x=>x.id==id);
  if(!n){ document.getElementById('detail').innerHTML='Khabar nahi mili'; return; }
  document.getElementById('detail').innerHTML=`
    <h1>${n.title}</h1>
    <div class="meta">${n.category} | <span>${n.publishedAt}</span> | <span>By - The 4th Pillar News Team</span></div>
    <img src="${n.image}" onerror="this.src='https://via.placeholder.com/400x250'">
    <div class="content">${n.content}</div>
    <br><p style="font-size:13px;color:#666">यह खबर हमारे ऑटो सिस्टम द्वारा ${n.publishedAt} पर अपडेट की गई है। गाजियाबाद और देश-दुनिया की ताजा खबरों के लिए The 4th Pillar News पढ़ते रहें।</p>
  `;
}
loadDetail();
</script>
</body>
</html>
