<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News</title>
<style>
body{margin:0;font-family:sans-serif;background:#f2f2f2}
.header{background:#0a1e3c;color:white;padding:15px;text-align:center}
.box{background:white;margin:15px;padding:15px;border-radius:8px}
.box img{width:100%;border-radius:8px}
</style>
</head>
<body>
<div class="header"><a href="index.html" style="color:white;text-decoration:none">← Back</a> The 4th Pillar News</div>
<div class="box" id="content">Loading...</div>
<script>
async function load(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  let r = await fetch('news.json?v='+Date.now());
  let data = await r.json();
  let n = data.find(x=>x.id==id);
  if(!n){ document.getElementById('content').innerHTML="News not found"; return; }
  document.getElementById('content').innerHTML = `<h2>${n.title}</h2><p style="color:#b91c1c">${n.category} | ${n.date} | ${n.author}</p><img src="${n.image}"><p style="margin-top:15px;line-height:1.6">${n.title} से जुड़ी पूरी जानकारी। गाजियाबाद और देश-दुनिया की ताजा खबरों के लिए The 4th Pillar News पढ़ते रहें।<br><br>यह खबर हमारे ऑटो सिस्टम द्वारा अपडेट की गई है।</p>`;
  document.title = n.title;
}
load();
</script>
</body>
</html>
