<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Detail</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#fff;color:#111}
.top{background:#0b2047;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0}
.top img{width:48px;height:48px;border-radius:8px;background:#fff;object-fit:cover;border:2px solid #fff}
.top h1{color:#fff;font-size:17px;line-height:15px}
.top h1 b{display:block;color:#f2c14e;font-size:11px;font-weight:400;margin-top:3px}
.box{max-width:760px;margin:auto;padding:16px}
.back{display:inline-block;background:#0b2047;color:#fff;padding:6px 14px;border-radius:20px;text-decoration:none;margin-bottom:12px;font-size:13px}
.box img.main{width:100%;border-radius:12px;margin:12px 0}
.box h1{font-size:21px;line-height:26px;margin:10px 0}
.meta{font-size:12px;color:#666;margin-bottom:10px}
.box p{font-size:17px;line-height:28px;margin-bottom:16px;text-align:justify}
</style>
</head>
<body>
<div class="top">
<img src="./logo.png" onerror="this.onerror=null; this.src='./the4thpillarnews.jpg'; this.onerror=function(){this.src='./4thpillar24x7.jpg'; this.onerror=function(){this.src='https://iili.io/FxLxV5J.png'}}">
<h1>The Fourth Pillar News<b>Sach Ka Chautha Stambh | Gaurav Sharma</b></h1>
</div>
<div class="box">
<a class="back" href="./index.html">← Back</a>
<div id="d"></div>
</div>
<script>
const id=new URLSearchParams(location.search).get('id');
fetch('./news.json?'+Date.now()).then(r=>r.json()).then(arr=>{
 let n=arr.find(x=>String(x.id)==String(id))||arr[0];
 // Dusri site ka naam content se bhi hatao
 let cleanContent = n.content.replace(/ABP Live|ABP News|BBC Hindi|BBC News|Amar Ujala|Navbharat Times|Aaj Tak|Dainik Jagran/gi,'').replace(/<[^>]*>/g,'\n\n');
 document.getElementById('d').innerHTML=`
 <h1>${n.title}</h1>
 <div class="meta">${n.publishedAt} | ${n.category} | By Gaurav Sharma</div>
 <img class="main" src="${n.image}">
 <div style="white-space:pre-wrap">${cleanContent}</div>
 <br><p><b>रिपोर्ट: Gaurav Sharma | The 4th Pillar News</b></p>
 `;
});
</script>
</body>
</html>
