<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>News - The Fourth Pillar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#fff;color:#111}
.top{background:#0b2047;display:flex;align-items:center;padding:10px 14px;gap:12px;position:sticky;top:0;z-index:99}
.top img{width:44px;height:44px;border-radius:8px;background:#fff}
.top h1{color:#fff;font-size:16px}.top h1 b{color:#f2c14e;font-size:10px;display:block}
.back{padding:10px 14px}.back a{color:#0b2047;font-weight:800;text-decoration:none}
.wrap{max-width:780px;margin:0 auto;padding:0 14px 40px}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;color:#fff;margin:14px 0 10px}
.h{font-size:24px;line-height:1.3;margin:6px 0 10px}
.meta{font-size:12px;color:#666;margin-bottom:12px}
.img{width:100%;border-radius:12px;max-height:480px;object-fit:cover}
.para{font-size:17px;line-height:1.7;margin:18px 0;text-align:justify}
</style>
</head>
<body>
<div class="top"><img src="logo.png" onerror="this.src='4thpillar24x7.jpg'"><h1>The Fourth Pillar News<b>Gaurav Sharma</b></h1></div>
<div class="back"><a href="index.html">← Back</a></div>
<div class="wrap" id="wrap"><p style="padding:40px;text-align:center">Loading...</p></div>
<script>
const catColor={NCR:'#0b2047',National:'#b71c1c',International:'#0d47a1',Sports:'#1b5e20',Entertainment:'#6a1b9a',Business:'#3e2723',Technology:'#004d40'};
fetch('./news.json?v='+Date.now()).then(r=>r.json()).then(data=>{
let id=new URLSearchParams(location.search).get('id');
let n=data.find(x=>String(x.id)===String(id));
if(!n){document.getElementById('wrap').innerHTML='<h2>News Not Found - 500 limit ke baad delete ho gayi</h2>';return;}
let col=catColor[n.category]||'#0b2047';
let wc=n.word_count||((n.para1||'').split(' ').length+(n.para2||'').split(' ').length+(n.para3||'').split(' ').length);
document.getElementById('wrap').innerHTML=`
<span class="badge" style="background:${col}">${n.category||'News'}</span>
<h1 class="h">${n.title}</h1>
<div class="meta">${n.date||''} | ${wc} words | By Gaurav Sharma</div>
<img class="img" src="${n.image}" onerror="this.src='logo.png'">
<p class="para">${n.para1||''}</p>
<p class="para">${n.para2||''}</p>
<p class="para">${n.para3||''}</p>
`;
document.title=n.title;
});
</script>
</body>
</html>
