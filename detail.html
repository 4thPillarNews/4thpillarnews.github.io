<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>News Detail</title>
<style>body{font-family:Arial;max-width:800px;margin:auto;padding:15px} img{width:100%;border-radius:10px}</style>
</head>
<body>
<a href="index.html">← Back</a>
<div id="box"></div>
<script>
const id=new URLSearchParams(location.search).get('id');
fetch('./news.json?v='+Date.now()).then(r=>r.json()).then(data=>{
 let n=data.find(x=>x.id==id) || data[0];
 document.getElementById('box').innerHTML=`<h1>${n.title}</h1><p>${n.publishedAt} | ${n.category}</p><img src="${n.image}"><div>${n.content}</div><br><a href="${n.url}" target="_blank">Original Source</a>`;
});
</script>
</body>
</html>
