<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<style>body{margin:0;font-family:system-ui;background:#fff} .top{background:#0b2047;display:flex;align-items:center;gap:10px;padding:10px;color:#fff} .top img{width:40px;height:40px;border-radius:6px;background:#fff} .box{max-width:760px;margin:auto;padding:16px} .box img{width:100%;border-radius:10px} .box p{line-height:26px;font-size:17px;margin:14px 0}</style></head><body>
<div class="top"><img src="the4thpillarnews.jpg" onerror="this.src='https://iili.io/FxLxV5J.png'"><b>The 4th Pillar News</b></div>
<div class="box"><a href="index.html">← Back</a><div id="d"></div></div>
<script>
const id=new URLSearchParams(location.search).get('id');
fetch('./news.json?'+Date.now()).then(r=>r.json()).then(a=>{
 let n=a.find(x=>String(x.id)==String(id))||a[0];
 let paras=n.content.replace(/<[^>]*>/g,'').split('।').filter(s=>s.trim().length>20);
 document.getElementById('d').innerHTML=`<h1>${n.title}</h1><p style="color:#666;font-size:13px">${n.publishedAt} | ${n.category} | ${n.author}</p><img src="${n.image}">${paras.map(p=>`<p>${p}।</p>`).join('')}<br><p><b>Source: ${n.source}</b></p>`;
});
</script></body></html>
