name: Auto Update
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python news.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add news.json
          git commit -m "update" || exit 0
          git push
