name: Auto Update Every 2 Min
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Run Update
        run: python news.py
        
      - name: Commit
        run: |
          git config --global user.name "Gaurav Sharma"
          git config --global user.email "gaurav@4thpillarnews.com"
          git add news.json
          git commit -m "Auto Update $(date)" || echo "No change"
          git push
