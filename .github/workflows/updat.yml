name: Auto Update Every 5 Min
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run Update
        run: |
          pip install feedparser requests || true
          python news.py
          
      - name: Commit and Push
        run: |
          git config --global user.name "Gaurav Sharma"
          git config --global user.email "gaurav@4thpillarnews.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto Update $(date)"
            git push
          fi
