name: Update News
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install requests beautifulsoup4 pillow lxml
      - name: Run bot
        run: python news.py
      - name: Commit and push
        run: |
          git config --global user.email "bot@4thpillar.com"
          git config --global user.name "bot"
          touch .nojekyll
          git add news.json || true
          git add images/ || true
          git add .nojekyll || true
          git diff --staged --quiet || git commit -m "auto update news & images"
          git push
