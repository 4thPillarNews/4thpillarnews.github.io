name: Auto News Update
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python news.py
      - run: |
          git config --global user.name "4thPillarNews"
          git config --global user.email "news@4thpillar.com"
          git add news.json || true
          git diff --staged --quiet || git commit -m "auto update"
          git push || true
