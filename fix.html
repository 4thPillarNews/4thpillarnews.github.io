<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>Fix</title></head>
<body style="font-family:Arial;padding:15px">
<h3>Fix ho gaya</h3>
<button id="btn" style="padding:12px 20px;background:#b30000;color:#fff;border:0;border-radius:8px;font-size:16px">news.json Download Karo</button>
<p id="msg"></p>
<script>
let finalData = "";
fetch('news.json?v='+Date.now()).then(r=>r.json()).then(list=>{
 let titles = list.map(x=>x.title.slice(0,25));
 finalData = list.map(n=>{
   function clean(p){
     if(!p) return "";
     let pp=p;
     for(let t of titles){ let idx=pp.indexOf(t); if(idx>100) pp=pp.substring(0,idx); }
     return pp.trim();
   }
   return { id:n.id, title:n.title, date:n.date, category:n.category||"General", image:n.image, para1:clean(n.para1), para2:clean(n.para2), para3:clean(n.para3||""), para4:clean(n.para4||""), link:"article.html?id="+n.id };
 });
 document.getElementById('msg').innerText = "Total "+finalData.length+" news ready hai. Neeche button dabao.";
});
document.getElementById('btn').onclick = ()=>{
  let blob = new Blob([JSON.stringify(finalData,null,2)], {type:"application/json"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "news.json";
  a.click();
};
</script>
</body>
</html>
