<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4th Pillar News</title>
<style>
body{font-family:system-ui;margin:0;background:#f5f5f5}
header{background:#111;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header img{height:40px;width:auto;background:#fff;padding:4px;border-radius:6px}
#news{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:20px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:180px;object-fit:cover;background:#ddd}
.card .p{padding:12px}
.card h3{margin:0 0 8px;font-size:16px}
</style>
</head>
<body>
<header>
<img src="./logo.png?v=3" alt="4thPillarNews">
<h1 style="font-size:20px;margin:0">4th Pillar News</h1>
</header>

<div id="news">Loading news...</div>

<script>
fetch('./news.json?v='+Date.now())
.then(r=>r.json())
.then(data=>{
 const c=document.getElementById('news');
 if(!data || !data.length){ c.innerHTML='<p style=padding:20px>No news, wait 3 hours for auto update.</p>'; return; }
 c.innerHTML=data.map(n=>`
  <div class="card">
   <img src="${n.image||'./logo.png'}" onerror="this.src='./logo.png'">
   <div class="p">
    <h3>${n.title||''}</h3>
    <p>${(n.description||'').slice(0,110)}...</p>
    <button onclick="alert('${n.title}')">Puri khabar padho</button>
   </div>
  </div>
 `).join('');
});
</script>
</body>
</html>
