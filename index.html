<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 4th Pillar News</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f2f2f2}
.top{background:#0b2047;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:10}
.top img{width:48px;height:48px;border-radius:8px;background:#fff;object-fit:cover;border:2px solid #fff}
.top h1{color:#fff;font-size:17px;line-height:15px}
.top h1 b{display:block;color:#f2c14e;font-size:11px;font-weight:400;margin-top:3px}
.grid{max-width:1100px;margin:auto;padding:12px;display:grid;gap:14px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.1);cursor:pointer}
.card img{width:100%;height:180px;object-fit:cover;background:#ddd}
.pad{padding:12px}
.cat{background:#0b2047;color:#f2c14e;font-size:11px;padding:3px 8px;border-radius:20px}
.card h3{font-size:15px;line-height:20px;margin:8px 0}
.desc{font-size:13px;color:#444;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.meta{font-size:11px;color:#888;margin-top:6px}
</style>
</head>
<body>
<div class="top">
<img id="logo" src="./logo.png" onerror="this.onerror=null; this.src='./the4thpillarnews.jpg'; this.onerror=function(){this.src='./4thpillar24x7.jpg'; this.onerror=function(){this.src='https://iili.io/FxLxV5J.png'}}">
<h1>The Fourth Pillar News<b>Sach Ka Chautha Stambh | Gaurav Sharma</b></h1>
</div>
<div id="grid" class="grid">Loading...</div>
<script>
fetch('./news.json?'+Date.now()).then(r=>r.json()).then(data=>{
 document.getElementById('grid').innerHTML=data.map(n=>`
 <div class="card" onclick="location.href='./detail.html?id=${n.id}'">
  <img src="${n.image}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x200?text=News'">
  <div class="pad">
   <span class="cat">${n.category}</span>
   <h3>${n.title}</h3>
   <div class="desc">${n.description||''}</div>
   <div class="meta">${n.publishedAt} | ${n.author||'Gaurav Sharma'}</div>
  </div>
 </div>`).join('');
});
</script>
</body>
</html>
