<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The 4th Pillar News - Ghaziabad & Desh ki Taza Khabar</title>
<meta name="description" content="Ghaziabad aur desh-duniya ki taza khabrein Hindi me">
<style>
body{font-family:system-ui;margin:0;background:#f5f5f5}
header{background:#0a1e3c;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header img{height:40px;background:#fff;padding:4px;border-radius:6px}
#news{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:20px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer}
.card img{width:100%;height:180px;object-fit:cover;background:#ddd}
.card .p{padding:12px}
.card h3{margin:0 0 8px;font-size:16px;line-height:1.4}
.card p{font-size:13px;color:#555;margin:0}
</style>
</head>
<body>
<header>
<img src="./logo.png" alt="logo" onerror="this.style.display='none'">
<h1 style="font-size:18px;margin:0">The 4th Pillar News</h1>
</header>
<div id="news">Khabar load ho rahi hai...</div>
<script>
fetch('./news.json?v='+Date.now()).then(r=>r.json()).then(data=>{
 const c=document.getElementById('news');
 if(!data || !data.length){ c.innerHTML='<p style=padding:20px>Khabar nahi hai.</p>'; return; }
 c.innerHTML=data.map(n=>`
  <div class="card" onclick="location.href='detail.html?id=${n.id}'">
   <img src="${n.image||'./logo.png'}" loading="lazy" onerror="this.src='./logo.png'">
   <div class="p">
    <h3>${n.title||''}</h3>
    <p>${(n.description||'').slice(0,90)}...</p>
    <p style="color:#b91c1c;font-size:11px;margin-top:6px">${n.publishedAt||''}</p>
   </div>
  </div>`).join('');
}).catch(()=>{document.getElementById('news').innerHTML='Load fail, refresh karo';});
</script>
</body>
</html>
