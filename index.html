<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 4th Pillar News - Gaurav Sharma</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#0b2047;color:#fff;padding:15px;text-align:center}
header h1{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px;padding:15px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer}
.card img{width:100%;height:180px;object-fit:cover}
.card.c{padding:12px}
.cat{background:#0b2047;color:#f2c14e;font-size:11px;padding:3px 8px;border-radius:4px;display:inline-block;margin-bottom:6px}
.card h3{margin:6px 0;font-size:16px;line-height:22px}
.meta{font-size:12px;color:#666}
</style>
</head>
<body>
<header><h1>The 4th Pillar News</h1><div>Gaurav Sharma | Ghaziabad / Desh</div></header>
<div id="grid" class="grid"></div>
<script>
fetch('./news.json?v='+Date.now()).then(r=>r.json()).then(data=>{
 let html='';
 data.forEach(n=>{
   html+=`<div class="card" onclick="location.href='detail.html?id=${n.id}'">
   <img src="${n.image}" onerror="this.src='https://via.placeholder.com/400x200?text=News'">
   <div class="c"><span class="cat">${n.category||'News'}</span>
   <h3>${n.title}</h3>
   <div class="meta">${n.publishedAt||''} | ${n.author||'Gaurav Sharma'}</div>
   </div></div>`;
 });
 document.getElementById('grid').innerHTML=html;
}).catch(e=>{
 document.getElementById('grid').innerHTML='<h2 style="text-align:center">news.json load nahi hua: '+e+'</h2>';
});
</script>
</body>
</html>
