<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4th Pillar News</title>
<style>
body{font-family:system-ui;margin:0;background:#f5f5f5}
header{background:#111;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header img{height:40px;background:#fff;padding:4px;border-radius:6px}
#news{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:20px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:180px;object-fit:cover;background:#ddd}
.card .p{padding:12px}
.card h3{margin:0 0 8px;font-size:16px}
.btn{background:#111;color:#fff;border:0;padding:8px 12px;border-radius:6px;margin-top:8px;cursor:pointer}
#pop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#pop .box{background:#fff;padding:20px;border-radius:12px;max-width:500px;width:100%}
</style>
</head>
<body>
<header>
<img src="./logo.png?v=3" alt="4thPillarNews">
<h1 style="font-size:20px;margin:0">4th Pillar News</h1>
</header>

<div id="news">Khabar load ho rahi hai...</div>
