<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The 4th Pillar News - Sach Ka Chautha Stambh</title>
<!-- ADSENSE - apna code yahan lagana -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#f4f6f9}
.header{background:#0b2047;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:99}
.header img{width:50px;height:50px;border-radius:12px;background:#fff;object-fit:cover}
.header h1{color:#fff;font-size:19px;line-height:1.1}.header h1 span{color:#f2c14e;font-size:12px;display:block;font-weight:600}
.filter{display:flex;gap:8px;overflow:auto;padding:10px 12px;background:#fff;border-bottom:1px solid #ddd}
.filter button{border:1px solid #0b2047;background:#fff;color:#0b2047;padding:6px 14px;border-radius:20px;white-space:nowrap;font-weight:700}
.filter button.active{background:#0b2047;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:14px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card img{width:100%;height:180px;object-fit:cover}
.c{padding:12px}.c small{color:#b71c1c;font-weight:700}.c h3{font-size:17px;margin:6px 0;line-height:1.3}
.c a{display:inline-block;margin-top:6px;color:#0b2047;font-weight:800;text-decoration:none}
.page{display:flex;justify-content:center;gap:8px;padding:16px;flex-wrap:wrap}
.page button{padding:8px 14px;border:1px solid #0b2047;border-radius:8px;background:#fff;font-weight:700}
.page button.active{background:#0b2047;color:#fff}
.ad-box{background:#fff;border:1px dashed #999;margin:14px;text-align:center;padding:20px;border-radius:10px;color:#666}
</style>
</head>
<body>
<div class="header">
<img src="logo.png" onerror="this.src='4thpillar24x7.jpg'">
<h1>The 4th Pillar News<span>Sach Ka Chautha Stambh | Gaurav Sharma</span></h1>
</div>
<div class="filter" id="filter">
<button class="active" onclick="showCat('All',this)">All</button>
<button onclick="showCat('Ghaziabad',this)">Ghaziabad</button>
<button onclick="showCat('National',this)">National</button>
<button onclick="showCat('International',this)">International</button>
<button onclick="showCat('Sports',this)">Sports</button>
<button onclick="showCat('Entertainment',this)">Entertainment</button>
<button onclick="showCat('Business',this)">Business</button>
<button onclick="showCat('Technology',this)">Technology</button>
</div>

<!-- ADSENSE TOP -->
<div class="ad-box">AdSense Top - yahan ad ayega</div>

<div id="grid" class="grid"></div>

<!-- ADSENSE MIDDLE -->
<div class="ad-box">AdSense Middle - har 10 news ke baad</div>

<div id="pagination" class="page"></div>

<!-- ADSENSE BOTTOM -->
<div class="ad-box">AdSense Bottom</div>

<script>
let allNews=[], filtered=[], currentPage=1;
const perPage = 10;
const MAX_NEWS = 500;

fetch('./news.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  // 500 se zyada ho to sabse purani delete
  if(d.length > MAX_NEWS){
    d = d.slice(-MAX_NEWS);
  }
  allNews = d.slice().reverse(); // latest pehle
  filtered = allNews;
  renderPage(1);
});

function renderPage(p){
  currentPage=p;
  let start=(p-1)*perPage, end=start+perPage;
  let list=filtered.slice(start,end);
  let h='';
  list.forEach(n=>{
    h+=`<div class="card"><img src="${n.image}"><div class="c"><small>${n.category} | ${n.date}</small><h3>${n.title}</h3><a href="article.html?id=${n.id}">पढ़ें →</a></div></div>`;
  });
  document.getElementById('grid').innerHTML=h;
  renderPagination();
}

function renderPagination(){
  let total=Math.ceil(filtered.length/perPage);
  let h='';
  for(let i=1;i<=total;i++){
    h+=`<button class="${i===currentPage?'active':''}" onclick="renderPage(${i})">${i}</button>`;
  }
  document.getElementById('pagination').innerHTML=h;
}

function showCat(cat,el){
  document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  if(cat==='All') filtered=allNews;
  else filtered=allNews.filter(x=>x.category===cat);
  renderPage(1);
}
</script>
</body>
</html>
