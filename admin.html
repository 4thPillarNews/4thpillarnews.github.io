<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin</title>
<style>body{font-family:Arial;background:#f4f4f4;padding:10px} .box{background:#fff;padding:15px;margin-bottom:15px;border-radius:8px} input,textarea{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:4px;box-sizing:border-box} button{padding:12px 20px;border:none;border-radius:5px;color:#fff;cursor:pointer;width:100%;margin-top:10px;font-weight:bold} .red{background:#d32f2f} .green{background:green} .black{background:#000} img{width:100%;height:150px;object-fit:cover;border-radius:5px}</style>
</head><body>
<div id="login" style="max-width:400px;margin:80px auto;background:#fff;padding:30px;border-radius:10px"><h2>Admin Login</h2><input type="password" id="p" placeholder="Password"><button class="red" onclick="login()">LOGIN</button></div>
<div id="main" style="display:none">
<h2>Admin Panel</h2>
<button class="green" onclick="makeFinal()">STEP 1: Sare Update ke baad Yaha Click Karo</button>
<textarea id="finalJson" rows="12" placeholder="Yaha final code ayega... COPY karna hai" style="height:250px;border:2px solid green"></textarea>
<button class="black" onclick="copyFinal()">STEP 2: COPY KARO</button>
<p style="background:yellow;padding:10px">COPY ke baad GitHub > news.json > Edit > Paste > Commit</p>
<hr>
<div id="list"></div>
</div>
<script>
const PASS="Virus@P@ssw0rd"; // Tera naya password yaha daal de
let allNews=[];
function login(){ if(document.getElementById('p').value===PASS){ document.getElementById('login').style.display='none'; document.getElementById('main').style.display='block'; load(); } else alert("Wrong Password"); }
async function load(){ let r=await fetch('news.json?v='+Date.now()); allNews=await r.json(); let h=''; allNews.forEach((n,i)=>{ h+=`<div class="box"><img src="${n.image}"><input id="t${i}" value="${n.title.replace(/"/g,'&quot;')}"><input id="img${i}" value="${n.image}"><input id="d${i}" value="${n.date}"><textarea id="p1${i}" rows="2">${n.para1}</textarea><textarea id="p2${i}" rows="2">${n.para2}</textarea><button class="red" onclick="up(${i})">UPDATE karo</button><button class="black" style="margin-top:5px;background:#555" onclick="del(${i})">DELETE</button></div>`; }); document.getElementById('list').innerHTML=h; }
function up(i){ allNews[i].title=document.getElementById('t'+i).value; allNews[i].image=document.getElementById('img'+i).value; allNews[i].date=document.getElementById('d'+i).value; allNews[i].para1=document.getElementById('p1'+i).value; allNews[i].para2=document.getElementById('p2'+i).value; alert("Update Done! Ab upar STEP 1 dabao"); }
function del(i){ if(confirm("Delete?")){ allNews.splice(i,1); load(); } }
function makeFinal(){ allNews.forEach((n,idx)=>{ n.id=idx; n.link=`article.html?id=${idx}`; }); document.getElementById('finalJson').value=JSON.stringify(allNews,null,2); document.getElementById('finalJson').scrollIntoView(); }
function copyFinal(){ let t=document.getElementById('finalJson'); t.select(); document.execCommand('copy'); alert("COPY HO GAYA! Ab GitHub me jaake paste kar de"); }
</script></body></html>
